[package]
name = "kleido"
version = "0.1.0"
description = "Outil de signature cryptographique offline pour créateurs de contenu"
authors = ["Kleido"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kleido_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rand_core = { version = "0.6", features = ["std"] }
hex = "0.4"
bip39 = { version = "2", features = ["zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Volontairement absent : tauri-plugin-http / reqwest / toute lib réseau.
# C'est une contrainte de sécurité structurelle, pas un oubli — voir Kleido.md.
